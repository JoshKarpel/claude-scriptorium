<!-- The light a folio is read by: a candle after dark, the sun by day. Both are
     drawn here, in one box; the stylesheet pigments each from a light-dark()
     pair whose off-scheme half is transparent, so exactly one is ever lit. -->
<svg class="luminary" viewBox="0 0 40 56" aria-hidden="true" focusable="false">
  <!-- The sun hangs a little above where the candle stands, but not so high
       it floats free of the control beneath it. -->
  <g class="luminary__sun" transform="translate(0 4)">
    <circle class="luminary__corona" cx="20" cy="28" r="11" />
    <g class="luminary__rays">
      <path d="M33 28h4M29.2 37.2l2.8 2.8M20 41v4M10.8 37.2l-2.8 2.8M7 28H3M10.8 18.8l-2.8-2.8M20 15v-4M29.2 18.8l2.8-2.8" />
    </g>
    <circle class="luminary__disc" cx="20" cy="28" r="8" />
  </g>
  <g class="luminary__candle">
    <path class="luminary__wax" d="M14 30h12v20a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2z" />
    <path class="luminary__drip" d="M15.4 31c1.6 0 1.9 5 .3 5s-1.6-5-.3-5z" />
    <path class="luminary__wick" d="M20 27v3" />
    <circle class="luminary__halo" cx="20" cy="20" r="9" />
    <path class="luminary__flame" d="M20 8c4 6 6 10 6 14a6 6 0 0 1-12 0c0-4 2-8 6-14z" />
    <path class="luminary__ember" d="M20 16c2 3.2 3 5.2 3 7a3 3 0 0 1-6 0c0-1.8 1-3.8 3-7z" />
  </g>
</svg>
