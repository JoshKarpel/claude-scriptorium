[package]
name = "claude-scriptorium"
version = "0.1.5"
edition = "2024"
rust-version = "1.96"
description = "Render Claude Code sessions as self-contained HTML"
repository = "https://github.com/JoshKarpel/claude-scriptorium"
license = "MIT"
readme = "README.md"
keywords = ["claude", "transcript", "html", "cli"]
categories = ["command-line-utilities"]

# The release workflow tags as `v{version}` and uploads
# `{name}-{target}.tar.gz` (`.zip` on Windows). We spell the URL and format out
# rather than lean on binstall's defaults: its versionless default filename ends
# in `.tgz`, not the `.tar.gz` the upload action writes, so the default probe
# would miss.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.4", features = ["derive"] }
comrak = { version = "0.54.0", default-features = false, features = ["syntect-fancy"] }
inquire = "0.9.4"
jiff = { version = "0.2.34", features = ["serde"] }
maud = "0.27.0"
open = "5.4.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"

# The fonts are base64'd into their `@font-face` block at compile time.
[build-dependencies]
base64 = "0.22.1"

# What `just profile` builds: release code, but keeping the debug info a
# sampling profiler needs to name a frame. Its own profile rather than
# `release`, so a shipped binary isn't carrying symbols nobody reads.
[profile.profiling]
inherits = "release"
debug = true
